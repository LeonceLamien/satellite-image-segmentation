# ============================================================
# TEST 1: Focal Loss seul (sans Dice, sans weights)
# ============================================================

DATASET:
  USE_AUGMENTATION: True

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 128
  ASPP_OUTPUT_CHANNELS: 256
  ASPP_DROPOUT: 0.3
  ASPP_DILATIONS: [6, 12, 18]
  NUM_CLASSES: 5
  
TRAINING:
  LEARNING_RATE: 0.001
  EPOCH: 25
  BATCH_SIZE: 16
  DEVICE: cuda
  OPTIMIZER: Adam
  USE_SCHEDULER: True
  SCHEDULER_TYPE: ReduceLROnPlateau
  RANDOM_SEED: 2885

  # Focal Loss SANS class weights
  LOSS_TYPE: focal
  FOCAL_GAMMA: 2.0
  USE_CLASS_WEIGHTS: false
