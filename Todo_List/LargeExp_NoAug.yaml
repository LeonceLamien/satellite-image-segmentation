---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 64x64
  
  # Data Augmentation - DÉSACTIVÉ (baseline pure)
  USE_AUGMENTATION: FALSE

MODEL:
  # Architecture - Même capacité que LargeExp
  NB_CHANNEL: 256
  BACKBONE_CHANNELS: 256
  
  # ASPP configuration
  ASPP_OUTPUT_CHANNELS: 512
  ASPP_DROPOUT: 0.3  # Légère régularisation dans ASPP
  
  # Regularization - LÉGÈRE
  DROPOUT: 0.15
  USE_ATTENTION: FALSE
  
  # Loss function parameters
  LOSS_TYPE: CrossEntropyLoss
  
  # Class weights - AUCUN
  CLASS_WEIGHTS: null
  
TRAINING: 
  # Optimizer parameters
  LEARNING_RATE: 0.0005
  WEIGHT_DECAY: 0.00005  # Légère L2 regularization
  OPTIMIZER: Adam
  MOMENTUM: 0.9
  
  # Learning rate scheduler avec PATIENCE ÉLEVÉE
  LR_SCHEDULER: ReduceLROnPlateau
  LR_STEP_SIZE: 10
  LR_GAMMA: 0.5
  
  # Training parameters
  EPOCH: 50
  BATCH_SIZE: 8
  
  # Hardware
  DEVICE: cuda
  
  # Early stopping
  EARLY_STOPPING: TRUE
  PATIENCE: 20

# Strategy: LargeExp + Légère Régularisation
# 
# Différences vs LargeExp original:
# - Dropout: 0.1 → 0.15 (légère augmentation)
# - ASPP Dropout: 0.3 (ajouté)
# - Weight Decay: 0.0 → 0.00005 (très léger)
# - Patience: 10 → 20 (plus de temps pour converger)
# 
# PAS de:
# - Class weights (cassent l'équilibre)
# - Data augmentation (ralentit apprentissage)
# - Régularisation excessive
# 
# Target:
# - Train loss: ~0.38-0.42
# - Val loss: ~0.42-0.45
# - Gap: 0.03-0.05
# - Test Accuracy: ~0.72 (égal à LargeExp)
# - Pas d'effondrements de classes
