DATASET:
  RESIZE_SHAPE: 64x64
  NORMALIZE_MEAN: [0.485, 0.456, 0.406]
  NORMALIZE_STD: [0.229, 0.224, 0.225]
  NUM_WORKERS: 2

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 256
  ASPP_OUTPUT_CHANNELS: 256
  ASPP_DROPOUT: 0.5
  ASPP_DILATIONS: [3, 6, 9]
  NUM_CLASSES: 5
  
TRAINING:
  LEARNING_RATE: 0.0001
  EPOCH: 30
  BATCH_SIZE: 16
  DEVICE: cuda
  OPTIMIZER: Adam
  RANDOM_SEED: 2885
