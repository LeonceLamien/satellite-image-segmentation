DATASET:
  RESIZE_SHAPE: 64x64
  NORMALIZE_MEAN: [0.485, 0.456, 0.406]
  NORMALIZE_STD: [0.229, 0.224, 0.225]
  NUM_WORKERS: 2
  
  AUGMENTATION:
    # Geometric augmentations
    HORIZONTAL_FLIP: 0.5
    VERTICAL_FLIP: 0.5
    ROTATE90: 0.5                    # Rotation 90/180/270°
    ROTATION_LIMIT: 15               # Free rotation ±15°
    ROTATION_PROB: 0.4               # ⬆️ Augmenté de 0.3 à 0.4
    SHIFT_LIMIT: 0.1                 # Shift ±10%
    SCALE_LIMIT: 0.1                 # Zoom ±10%
    SHIFT_SCALE_ROTATE_LIMIT: 10
    SHIFT_SCALE_ROTATE_PROB: 0.4     # ⬆️ Augmenté de 0.3 à 0.4
    
    # Color augmentations
    BRIGHTNESS: 0.2                  # Brightness ±20%
    CONTRAST: 0.2                    # Contrast ±20%
    SATURATION: 0.2                  # Saturation ±20%
    HUE: 0.1                         # Hue ±10%
    COLOR_JITTER_PROB: 0.5
    
    # Noise augmentations
    GAUSS_NOISE_VAR: [10.0, 50.0]
    GAUSS_NOISE_PROB: 0.2
    BLUR_LIMIT: [3, 3]
    BLUR_PROB: 0.15
    
    # Optional augmentations (set to 0 to disable)
    ELASTIC_PROB: 0.0                # Elastic deformations (try 0.1)
    COARSE_DROPOUT_PROB: 0.0         # Occlusions/clouds (try 0.15)
    COARSE_DROPOUT_HOLES: 4
    COARSE_DROPOUT_SIZE: 0.05
    SHADOW_PROB: 0.0                 # Cloud shadows (try 0.2)

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 256
  ASPP_OUTPUT_CHANNELS: 256
  ASPP_DROPOUT: 0.5
  ASPP_DILATIONS: [3, 6, 9]
  NUM_CLASSES: 5
  
TRAINING:
  LEARNING_RATE: 0.0001
  EPOCH: 30
  BATCH_SIZE: 16
  DEVICE: cuda
  OPTIMIZER: Adam
  RANDOM_SEED: 2885
