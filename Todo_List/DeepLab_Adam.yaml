---
DATASET:
  RESIZE_SHAPE: 64x64

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 64
  DILATION_RATES: [6, 12, 18]
  ASPP_DROPOUT: 0.5
  
TRAINING: 
  OPTIMIZER: Adam
  LEARNING_RATE: 0.001
  EPOCH: 100
  BATCH_SIZE: 16
  DEVICE: cuda
  EARLY_STOPPING: true
  PATIENCE_EARLY_STOPPING: 10
