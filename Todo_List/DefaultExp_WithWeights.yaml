DATASET:
  USE_AUGMENTATION: True

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 128
  ASPP_OUTPUT_CHANNELS: 256
  ASPP_DROPOUT: 0.5
  ASPP_DILATIONS: [6, 12, 18]
  NUM_CLASSES: 5
  
TRAINING:
  LEARNING_RATE: 0.001
  EPOCH: 20
  BATCH_SIZE: 16
  DEVICE: cuda
  OPTIMIZER: Adam

  USE_SCHEDULER: True
  SCHEDULER_TYPE: CosineAnnealingLR

  RANDOM_SEED: 2885

  USE_CLASS_WEIGHTS: False
  CLASS_WEIGHT_METHOD: log_inverse
  CLASS_WEIGHT_SMOOTHING: 0.7
