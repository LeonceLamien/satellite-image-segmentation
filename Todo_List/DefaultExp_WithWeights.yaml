DATASET:
  USE_AUGMENTATION: True

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 256
  ASPP_OUTPUT_CHANNELS: 256
  ASPP_DROPOUT: 0.5
  ASPP_DILATIONS: [1, 3, 5]
  NUM_CLASSES: 5
  
TRAINING:
  LEARNING_RATE: 0.0001
  EPOCH: 20
  BATCH_SIZE: 16
  DEVICE: cuda
  OPTIMIZER: AdamW
  WEIGHT_DECAY: 0.0001

  USE_SCHEDULER: true
  SCHEDULER_TYPE: CosineAnnealingLR                   # Taux d'apprentissage minimum

  RANDOM_SEED: 2885

  USE_CLASS_WEIGHTS: true
  CLASS_WEIGHT_METHOD: sqrt_inverse
