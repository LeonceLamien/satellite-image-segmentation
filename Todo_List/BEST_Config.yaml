# ============================================================
# CONFIGURATION OPTIMALE - Toutes les améliorations appliquées
# ============================================================

DATASET:
  USE_AUGMENTATION: True

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 384
  ASPP_OUTPUT_CHANNELS: 512
  ASPP_DROPOUT: 0.3
  ASPP_DILATIONS: [6, 12, 18]
  NUM_CLASSES: 5
  
TRAINING:
  LEARNING_RATE: 0.0001
  EPOCH: 20
  BATCH_SIZE: 16
  DEVICE: cuda
  OPTIMIZER: Adam
  RANDOM_SEED: 2885
  USE_CLASS_WEIGHTS: False