# Configuration for Colorization Proxy Task

DATASET:
  RESIZE_SHAPE: "64x64"

TASK:
  # No additional task-specific parameters

MODEL:
  BASE_CHANNELS: 64
  DROPOUT: 0.2
  DILATION_RATES: [6, 12, 18]  # More dropout for better generalization

TRAIN:
  NUM_EPOCHS: 50
  BATCH_SIZE: 32
  LEARNING_RATE: 0.001
  WEIGHT_DECAY: 0.0001
  USE_SCHEDULER: true
  EARLY_STOP_PATIENCE: 10
  EARLY_STOP_MIN_DELTA: 0.0001
