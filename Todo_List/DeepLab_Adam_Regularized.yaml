---
# Config avec regularization pour réduire l'overfitting
DATASET:
  RESIZE_SHAPE: 64x64

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 64
  DILATION_RATES: [6, 12, 18]
  ASPP_DROPOUT: 0.4
  
TRAINING: 
  OPTIMIZER: Adam
  LEARNING_RATE: 0.0005  # LR plus faible
  EPOCH: 100
  BATCH_SIZE: 16
  DEVICE: cuda
  EARLY_STOPPING: true
  PATIENCE_EARLY_STOPPING: 15  # Plus de patience
  WEIGHT_DECAY: 0.0001  # Regularization L2
  LR_SCHEDULER: ReduceLROnPlateau  # Réduit LR si val loss stagne
  LR_PATIENCE: 5
  LR_FACTOR: 0.5
