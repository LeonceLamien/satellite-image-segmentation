---
# Config avec augmentation de données pour améliorer la généralisation
DATASET:
  RESIZE_SHAPE: 64x64
  USE_AUGMENTATION: true
  HORIZONTAL_FLIP: true
  VERTICAL_FLIP: true
  ROTATE_LIMIT: 15
  BRIGHTNESS_CONTRAST: true
  BLUR: true

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 64
  DILATION_RATES: [6, 12, 18]
  ASPP_DROPOUT: 0.3
  
TRAINING: 
  OPTIMIZER: Adam
  LEARNING_RATE: 0.001
  EPOCH: 100
  BATCH_SIZE: 16
  DEVICE: cuda
  EARLY_STOPPING: true
  PATIENCE_EARLY_STOPPING: 10
