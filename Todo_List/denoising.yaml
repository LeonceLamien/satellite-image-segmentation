# Configuration for Denoising Proxy Task

DATASET:
  RESIZE_SHAPE: "64x64"

TASK:
  NOISE_STD: 0.1  # Standard Gaussian noise level (optimal balance)

MODEL:
  BASE_CHANNELS: 64
  DROPOUT: 0.2

TRAIN:
  NUM_EPOCHS: 50
  BATCH_SIZE: 16
  LEARNING_RATE: 0.0001
  WEIGHT_DECAY: 0.0001
  EARLY_STOP_PATIENCE: 10
  EARLY_STOP_MIN_DELTA: 0.0001
