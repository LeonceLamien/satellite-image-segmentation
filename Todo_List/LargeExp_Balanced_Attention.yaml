---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 64x64
  
  # Data Augmentation - MODÉRÉE (pas trop agressive)
  USE_AUGMENTATION: TRUE
  # Geometric augmentations - Réduites
  HORIZONTAL_FLIP: 0.5
  VERTICAL_FLIP: 0.3
  ROTATE_LIMIT: 15  # 25 → 15 (moins agressif)
  SHIFT_SCALE_ROTATE: 0.3  # 0.5 → 0.3 (moins agressif)
  # Color augmentations - Réduites
  COLOR_JITTER: 0.4  # 0.6 → 0.4
  HUE_SAT_VALUE: 0.4  # 0.6 → 0.4
  BRIGHTNESS_CONTRAST: 0.3  # 0.5 → 0.3
  # Noise/blur - Très réduit
  GAUSSIAN_BLUR: 0.15  # 0.3 → 0.15
  GAUSSIAN_NOISE: 0.1  # 0.2 → 0.1

MODEL:
  # Architecture - Même capacité que LargeExp
  NB_CHANNEL: 256
  BACKBONE_CHANNELS: 256
  
  # ASPP configuration - Dropout RÉDUIT
  ASPP_OUTPUT_CHANNELS: 512
  ASPP_DROPOUT: 0.4  # 0.5 → 0.4 (moins agressif)
  
  # Regularization - Dropout RÉDUIT
  DROPOUT: 0.2  # 0.3 → 0.2 (équilibre entre 0.1 et 0.3)
  USE_ATTENTION: TRUE
  
  # Loss function parameters
  LOSS_TYPE: CrossEntropyLoss
  
  # Class weights - AJUSTÉS pour équilibrer toutes les classes
  # Basé sur l'analyse: Class 1 faible, Class 4 effondrée
  CLASS_WEIGHTS: null
  # Class 0 (36%): 1.0 → 0.9 (légèrement réduit)
  # Class 1 (0.84%): 3.0 → 4.0 (augmenté pour améliorer recall)
  # Class 2 (6%): 1.5 → 1.3 (légèrement réduit)
  # Class 3 (13%): 1.2 → 1.1 (légèrement réduit)
  # Class 4 (44%): 1.0 → 0.8 (réduit car effondrée)
  
TRAINING: 
  # Optimizer parameters - Weight Decay RÉDUIT
  LEARNING_RATE: 0.0004  # 0.0003 → 0.0004 (légèrement plus élevé)
  WEIGHT_DECAY: 0.00005  # 0.0001 → 0.00005 (divisé par 2)
  OPTIMIZER: AdamW
  MOMENTUM: 0.9
  
  # Learning rate scheduler
  LR_SCHEDULER: ReduceLROnPlateau
  LR_STEP_SIZE: 10
  LR_GAMMA: 0.5
  
  # Training parameters - PLUS D'EPOCHS
  EPOCH: 50  # 40 → 50 (plus de temps pour converger avec augmentation)
  BATCH_SIZE: 8
  
  # Hardware
  DEVICE: cuda
  
  # Early stopping - Plus de patience
  EARLY_STOPPING: TRUE
  PATIENCE: 15  # 12 → 15 (plus de patience)

# Strategy:
# 1. Régularisation MODÉRÉE (pas trop forte)
#    - Dropout: 0.2 (vs 0.3 précédent, 0.1 LargeExp)
#    - Weight decay: 0.00005 (vs 0.0001 précédent)
#    - Augmentation moins agressive
# 
# 2. Plus d'epochs (50 vs 40) pour compenser l'augmentation
# 
# 3. Class weights ajustés:
#    - Class 1: weight=4.0 (focus sur la classe la plus difficile)
#    - Class 4: weight=0.8 (éviter l'effondrement)
# 
# 4. Learning rate légèrement plus élevé (0.0004 vs 0.0003)
#
# Objectifs:
# - Train loss: ~0.45-0.50 (entre LargeExp 0.33 et LargeExp_Reg 0.61)
# - Val loss: ~0.48-0.52 (meilleur que les deux)
# - Gap: < 0.05
# - Test Accuracy: > 0.73 (mieux que DefaultExp)
# - Class 1 Recall: > 0.50
# - Class 4 Recall: > 0.55 (éviter l'effondrement)
