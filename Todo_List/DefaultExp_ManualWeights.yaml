DATASET:
  USE_AUGMENTATION: True

MODEL:
  ARCHITECTURE: DeepLabV3Plus
  BACKBONE_CHANNELS: 64
  ASPP_OUTPUT_CHANNELS: 256
  ASPP_DROPOUT: 0.5
  ASPP_DILATIONS: [6, 12, 18]
  NUM_CLASSES: 5
  
TRAINING:
  LEARNING_RATE: 0.001
  EPOCH: 20
  BATCH_SIZE: 16
  DEVICE: cuda
  OPTIMIZER: Adam

  USE_SCHEDULER: False

  RANDOM_SEED: 2885

  # MANUAL: Poids manuels finement ajustés
  # Class 1 (0.84%) : 2.0 (focus modéré)
  # Autres classes : proche de 1.0 (stabilité)
  USE_CLASS_WEIGHTS: true
  CLASS_WEIGHTS: [0.9, 2.0, 1.1, 1.0, 0.85]  # [C0, C1, C2, C3, C4]
