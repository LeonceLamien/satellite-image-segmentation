
# ---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 64x64

# MODEL:
#   NB_CHANNEL: 64
#   DROPOUT: 0.2
#   USE_ATTENTION: FALSE
#   TASK: "colorization"
        
#   # Do not hesitate to add other parameters...
  
# TRAINING: 
#   LEARNING_RATE: 0.0001
#   EPOCH: 20
#   BATCH_SIZE: 16
#   # cpu (to run on cpu) or cuda (to run on gpu)
#   DEVICE: cpu 
#   # Do not hesitate to add other parameters...

# CLUSTERING:
#   N_CLUSTERS: 4
#   METHOD: "kmeans" 
#   RANDOM_STATE: 2885
MODEL:
  TASK: "colorization"  # ou "segmentation"
  BACKBONE_CHANNELS: 64

TRAINING:
  EPOCH: 20
  BATCH_SIZE: 8
  LEARNING_RATE: 0.001
  DEVICE: "cpu"

CLUSTERING:
  METHOD: "kmeans"  # "kmeans", "dbscan","gmm"
  N_CLUSTERS: 5
  EPS: 2  # Pour DBSCAN
  MIN_SAMPLES: 10  # Pour DBSCAN
  USE_CONTEXTUAL: true
  RANDOM_STATE: 2885

CONTEXT:
  ENABLED: true
  CONTEXT_SIZE: 5
  USE_SPATIAL_CONTEXT: true
  USE_FEATURE_CONTEXT: true
  K_NEIGHBORS: 100