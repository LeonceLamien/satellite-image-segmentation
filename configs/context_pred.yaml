# Configuration for Context Prediction Proxy Task

DATASET:
  RESIZE_SHAPE: "64x64"

TASK:
  MASK_RATIO: 0.15  # Réduit à 15% - tâche plus facile
  PATCH_SIZE: 16    # Patches 16x16 bien visibles
  MASKED_ONLY_LOSS: true  # CRUCIAL: focus uniquement sur zones masquées

MODEL:
  BASE_CHANNELS: 64
  DROPOUT: 0.2  # Plus de dropout pour éviter overfitting

TRAIN:
  NUM_EPOCHS: 60  # Plus d'époques
  BATCH_SIZE: 16
  LEARNING_RATE: 0.001  # LR plus élevé pour apprentissage plus rapide
  WEIGHT_DECAY: 0.00001  # Très réduit
  USE_SCHEDULER: true
  EARLY_STOP_PATIENCE: 20  # Beaucoup plus de patience
  EARLY_STOP_MIN_DELTA: 0.00005  # Seuil plus strict
