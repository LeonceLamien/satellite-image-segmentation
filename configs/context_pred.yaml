# Configuration for Context Prediction Proxy Task

DATASET:
  RESIZE_SHAPE: "64x64"

TASK:
  MASK_RATIO: 0.2
  PATCH_SIZE: 16
  MASKED_ONLY_LOSS: false

MODEL:
  BASE_CHANNELS: 64
  DROPOUT: 0.1

TRAIN:
  NUM_EPOCHS: 50
  BATCH_SIZE: 16
  LEARNING_RATE: 0.0005
  WEIGHT_DECAY: 0.00005
  USE_SCHEDULER: true
  EARLY_STOP_PATIENCE: 15
  EARLY_STOP_MIN_DELTA: 0.0001
